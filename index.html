<!doctype html>
<html lang="tr">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kredi Kartı Komisyon Hesaplayıcı</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Modern Arka Planlar */
        .dark-mode {
            background: radial-gradient(circle at top right, #1e293b 0%, #0f172a 40%, #020617 100%);
            background-attachment: fixed;
        }
        
        .light-mode {
            background: radial-gradient(circle at top right, #f8fafc 0%, #e0e7ff 40%, #c7d2fe 100%);
            background-attachment: fixed;
        }

        /* Modern Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.5); }
        
        /* Glass & Premium Kartlar */
        .glass-effect {
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        
        .dark .glass-effect {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .premium-card {
            background: linear-gradient(145deg, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.85) 100%);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
        }
        
        .dark .premium-card {
            background: linear-gradient(145deg, rgba(30,41,59,0.9) 0%, rgba(15,23,42,0.8) 100%);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(71, 85, 105, 0.3);
        }

        /* Gradient Metinler */
        .gradient-text {
            background: linear-gradient(135deg, #4f46e5 0%, #9333ea 50%, #db2777 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .dark .gradient-text {
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 50%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Animasyonlar */
        .animate-fade-in { animation: fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        .animate-slide-up { animation: slideUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards; opacity: 0; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Mobil Optimizeli Input */
        .input-premium {
            background: rgba(255,255,255,0.9);
            transition: all 0.3s ease;
        }
        .input-premium:focus {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.2);
        }
        .dark .input-premium {
            background: rgba(30,41,59,0.8);
        }
        .dark .input-premium:focus {
            box-shadow: 0 10px 25px -5px rgba(129, 140, 248, 0.2);
        }

        /* Butonlar */
        .gradient-button {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .gradient-button:active {
            transform: scale(0.98);
        }

        /* Tablo Satır Hover */
        .table-row-premium:hover td {
            background: rgba(99, 102, 241, 0.05);
        }
        .dark .table-row-premium:hover td {
            background: rgba(99, 102, 241, 0.1);
        }

        /* Hızlı Örnek Kartları */
        .quick-example-card {
            background: rgba(255,255,255,0.6);
            border: 1px solid rgba(255,255,255,0.8);
            transition: all 0.2s ease;
        }
        .quick-example-card:active { transform: scale(0.95); }
        .dark .quick-example-card {
            background: rgba(30,41,59,0.5);
            border: 1px solid rgba(71,85,105,0.4);
        }
    </style>
  <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#4f46e5', 600: '#4338ca' }
                    }
                }
            }
        }
    </script>
 </head>
 <body class="light-mode dark:dark-mode min-h-screen p-3 sm:p-6 transition-colors duration-500">
  
  <div class="max-w-5xl mx-auto pb-12">
   
   <div class="flex justify-end mb-4 sm:mb-8">
    <button onclick="toggleDarkMode()" class="glass-effect p-3 sm:p-4 rounded-2xl text-gray-700 dark:text-gray-300 transition-all hover:scale-105 active:scale-95 z-50">
     <svg id="sun-icon" class="w-6 h-6 dark:hidden text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
     <svg id="moon-icon" class="w-6 h-6 hidden dark:block text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
    </button>
   </div>

   <div class="text-center mb-8 sm:mb-12 animate-fade-in px-2">
    <div class="inline-block relative mb-3 sm:mb-4">
     <span class="text-4xl sm:text-6xl drop-shadow-xl">💳</span>
     <div class="absolute -inset-4 bg-indigo-500 rounded-full blur-2xl opacity-20 animate-pulse"></div>
    </div>
    <h1 class="text-3xl sm:text-5xl font-black gradient-text mb-3 tracking-tight">Komisyon Hesaplayıcı</h1>
    <p class="text-xs sm:text-base text-gray-600 dark:text-gray-300 font-medium max-w-xl mx-auto px-4">
        İstediğiniz net tutarı girin, müşteriden çekmeniz gereken toplam tutarı anında görün.
    </p>
   </div>

   <div class="animate-slide-up" style="animation-delay: 0.1s;">
    <div class="premium-card rounded-2xl sm:rounded-3xl p-5 sm:p-10 mb-8 sm:mb-12">
     
     <div class="relative mb-6 sm:mb-8">
      <label class="block text-sm sm:text-base font-bold text-gray-800 dark:text-gray-200 mb-2 sm:mb-3 ml-1">
        Elinize Geçecek Net Tutar (₺)
      </label>
      <div class="relative group">
       <div class="absolute inset-y-0 left-0 pl-4 sm:pl-6 flex items-center pointer-events-none">
        <span class="text-gray-400 dark:text-gray-500 text-xl sm:text-3xl font-bold group-focus-within:text-indigo-500 transition-colors">₺</span>
       </div>
       <input type="number" id="saleAmount" class="input-premium w-full pl-12 sm:pl-16 pr-4 sm:pr-6 py-4 sm:py-6 border-2 border-transparent focus:border-indigo-500 dark:border-gray-700 dark:focus:border-indigo-400 rounded-xl sm:rounded-2xl text-2xl sm:text-4xl font-black text-gray-900 dark:text-white placeholder-gray-300 dark:placeholder-gray-600 outline-none" placeholder="0.00" step="0.01" inputmode="decimal" pattern="[0-9]*">
      </div>
     </div>

     <button onclick="calculateWithMarkup()" class="gradient-button w-full text-white font-black py-4 sm:py-5 px-6 rounded-xl sm:rounded-2xl text-base sm:text-xl relative overflow-hidden flex items-center justify-center">
      <svg class="w-5 h-5 sm:w-6 sm:h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
      Hesapla
     </button>

     <div id="creditCardResult" class="hidden mt-8 sm:mt-12 animate-fade-in border-t border-gray-200 dark:border-gray-800 pt-8 sm:pt-10">
      
      <div class="flex flex-col sm:flex-row justify-between items-center mb-6 sm:mb-8 gap-4">
       <h3 class="text-xl sm:text-2xl font-black text-gray-900 dark:text-white flex items-center">
        <span class="w-8 h-8 rounded-lg bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-400 flex items-center justify-center mr-3">📊</span>
        Taksit Detayları
       </h3>
       
       <button onclick="generatePDF()" class="w-full sm:w-auto bg-white dark:bg-gray-800 text-indigo-600 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-900/50 hover:bg-indigo-50 dark:hover:bg-indigo-900/30 font-bold py-3 px-6 rounded-xl transition-all shadow-sm flex items-center justify-center active:scale-95">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg> 
        PDF İndir
       </button>
      </div>

      <div class="relative rounded-xl sm:rounded-2xl overflow-hidden border border-gray-200 dark:border-gray-700/50 shadow-inner bg-white/50 dark:bg-gray-900/50">
       <div class="overflow-x-auto">
        <table class="w-full min-w-[500px] sm:min-w-[700px] text-left border-collapse">
         <thead class="bg-gray-50/80 dark:bg-gray-800/80 text-gray-600 dark:text-gray-400 text-[10px] sm:text-xs uppercase tracking-wider font-black">
          <tr>
           <th class="sticky left-0 z-10 bg-gray-50 dark:bg-gray-800 px-4 py-4 border-b border-gray-200 dark:border-gray-700/50 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]">Taksit Detayı</th>
           <th class="px-4 py-4 border-b border-gray-200 dark:border-gray-700/50">Çekilecek Tutar</th>
           <th class="px-4 py-4 border-b border-gray-200 dark:border-gray-700/50">Müşteri Ödemesi</th>
           <th class="px-4 py-4 border-b border-gray-200 dark:border-gray-700/50 text-right">Kesinti</th>
          </tr>
         </thead>
         <tbody id="installmentTable" class="divide-y divide-gray-100 dark:divide-gray-800/60 text-sm sm:text-base">
          </tbody>
        </table>
       </div>
      </div>
     </div>

    </div>
   </div>

   <div class="animate-slide-up" style="animation-delay: 0.2s;">
    <h3 class="text-sm sm:text-base font-bold text-gray-500 dark:text-gray-400 mb-4 px-2 uppercase tracking-wider text-center sm:text-left">Hızlı Doldur</h3>
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4">
     <button onclick="setQuickExample(1000)" class="quick-example-card rounded-xl p-4 text-center group">
      <div class="font-black text-xl sm:text-2xl text-indigo-600 dark:text-indigo-400 mb-1 group-hover:scale-110 transition-transform">1.000₺</div>
     </button>
     <button onclick="setQuickExample(5000)" class="quick-example-card rounded-xl p-4 text-center group">
      <div class="font-black text-xl sm:text-2xl text-purple-600 dark:text-purple-400 mb-1 group-hover:scale-110 transition-transform">5.000₺</div>
     </button>
     <button onclick="setQuickExample(10000)" class="quick-example-card rounded-xl p-4 text-center group">
      <div class="font-black text-xl sm:text-2xl text-pink-600 dark:text-pink-400 mb-1 group-hover:scale-110 transition-transform">10.000₺</div>
     </button>
     <button onclick="setQuickExample(25000)" class="quick-example-card rounded-xl p-4 text-center group">
      <div class="font-black text-xl sm:text-2xl text-rose-600 dark:text-rose-400 mb-1 group-hover:scale-110 transition-transform">25.000₺</div>
     </button>
    </div>
   </div>

  </div>

  <script>
        // Komisyon Oranları (İhtiyaç dahilinde tüm liste duruyor)
        const commissionRates = {
            credit: {
                1: 4.0,  
                2: 7.11, 3: 8.98, 4: 10.85, 5: 12.71, 6: 14.58, 
                7: 16.45, 8: 18.32, 9: 20.19, 10: 22.06, 11: 23.93, 12: 25.80, 
                13: 27.67, 14: 29.54, 15: 31.41, 16: 33.28, 17: 35.15, 18: 37.02 
            }
        };

        let inputTimeout;
        
        document.addEventListener('DOMContentLoaded', function() {
            const saleInput = document.getElementById('saleAmount');
            
            saleInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    clearTimeout(inputTimeout);
                    calculateWithMarkup();
                    this.blur(); // Mobilde klavyeyi kapatmak için
                }
            });
            
            saleInput.addEventListener('input', function() {
                clearTimeout(inputTimeout);
                const value = parseFloat(this.value);
                
                if (this.value === '' || this.value === null) {
                    document.getElementById('creditCardResult').classList.add('hidden');
                    return;
                }
                
                if (!isNaN(value) && value > 0) {
                    inputTimeout = setTimeout(function() {
                        calculateWithMarkup();
                    }, 400); // Mobilde yazarken çok titrememesi için 400ms
                } else if (value <= 0) {
                    document.getElementById('creditCardResult').classList.add('hidden');
                }
            });
        });

        function calculateWithMarkup() {
            const desiredNet = parseFloat(document.getElementById('saleAmount').value);
            
            if (isNaN(desiredNet) || desiredNet <= 0) {
                return; // Geçersiz tutar
            }
            
            generateInstallmentTable(desiredNet);
            document.getElementById('creditCardResult').classList.remove('hidden');
            
            // Sonuç kısmına yumuşak kaydırma
            setTimeout(() => {
                document.getElementById('creditCardResult').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
        }

        function generateInstallmentTable(desiredNet) {
            const tableBody = document.getElementById('installmentTable');
            let tableHTML = '';
            
            // Taksit döngüsü 12 ile sınırlandırıldı
            for (let installment = 1; installment <= 12; installment++) {
                const rate = commissionRates.credit[installment];
                const saleAmount = desiredNet / (1 - rate / 100);
                const commissionAmount = saleAmount - desiredNet;
                const monthlyPayment = saleAmount / installment;
                
                const isSpecial = installment === 1;
                const rowClass = isSpecial ? 'bg-amber-50/50 dark:bg-amber-900/10' : 'bg-white/80 dark:bg-gray-800/80';
                const stickyBgClass = isSpecial ? 'bg-amber-50 dark:bg-[#251e18]' : 'bg-white dark:bg-gray-800';
                
                tableHTML += `
                    <tr class="table-row-premium transition-colors">
                        <td class="sticky left-0 z-10 ${stickyBgClass} px-4 py-3 sm:py-4 whitespace-nowrap shadow-[2px_0_5px_-2px_rgba(0,0,0,0.05)]">
                            <div class="flex flex-col items-start gap-1">
                                <div class="font-black ${isSpecial ? 'text-amber-600 dark:text-amber-500' : 'text-gray-900 dark:text-gray-100'}">
                                    ${isSpecial ? '⭐ Tek Çekim' : `<span class="w-6">${installment}</span> Taksit`}
                                </div>
                                <span class="px-2 py-0.5 rounded bg-gray-100 dark:bg-gray-700 text-[10px] sm:text-xs font-bold text-gray-600 dark:text-gray-400">
                                    %${rate}
                                </span>
                            </div>
                        </td>
                        <td class="px-4 py-3 sm:py-4 whitespace-nowrap font-black text-indigo-600 dark:text-indigo-400 text-base sm:text-lg">
                            ${saleAmount.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ₺
                        </td>
                        <td class="px-4 py-3 sm:py-4 whitespace-nowrap font-bold text-gray-700 dark:text-gray-300">
                            ${isSpecial ? '-' : `<span class="text-xs text-gray-400">Aylık</span> ${monthlyPayment.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ₺`}
                        </td>
                        <td class="px-4 py-3 sm:py-4 whitespace-nowrap text-right font-bold text-rose-500 dark:text-rose-400">
                            -${commissionAmount.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ₺
                        </td>
                    </tr>
                `;
            }
            
            tableBody.innerHTML = tableHTML;
        }

        function setQuickExample(amount) {
            const input = document.getElementById('saleAmount');
            input.value = amount;
            calculateWithMarkup();
        }

        // PDF İndirme Fonksiyonu 
        function generatePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            const desiredNet = parseFloat(document.getElementById('saleAmount').value);
            const today = new Date();
            const dateStr = today.toLocaleDateString('tr-TR');
            const timeStr = today.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
            
            function turkishToAscii(text) {
                const turkishChars = { 'ç': 'c', 'Ç': 'C', 'ğ': 'g', 'Ğ': 'G', 'ı': 'i', 'I': 'I', 'İ': 'I', 'i': 'i', 'ö': 'o', 'Ö': 'O', 'ş': 's', 'Ş': 'S', 'ü': 'u', 'Ü': 'U' };
                return text.replace(/[çÇğĞıIİiöÖşŞüÜ]/g, match => turkishChars[match] || match);
            }
            
            doc.setFillColor(79, 70, 229); 
            doc.rect(0, 0, 210, 35, 'F');
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(24);
            doc.text('EYMEN MOBILE', 20, 20);
            doc.setFontSize(12);
            doc.text(turkishToAscii('Kredi Karti Komisyon Hesaplama Raporu'), 20, 28);
            doc.setFontSize(10);
            doc.text(dateStr + ' - ' + timeStr, 150, 20);
            doc.text('Rapor No: #' + Math.floor(Math.random() * 10000), 150, 28);
            
            doc.setTextColor(0, 0, 0);
            let yPos = 50;
            
            doc.setFillColor(248, 250, 252);
            doc.rect(15, yPos, 180, 25, 'F');
            doc.setDrawColor(226, 232, 240);
            doc.rect(15, yPos, 180, 25, 'S');
            
            doc.setFontSize(14);
            doc.setTextColor(51, 65, 85);
            doc.text('HESAPLAMA DETAYLARI', 20, yPos + 8);
            doc.setFontSize(11);
            doc.text(turkishToAscii('Istenen Net Tutar:'), 20, yPos + 16);
            doc.setTextColor(79, 70, 229);
            doc.setFontSize(12);
            doc.text(desiredNet.toFixed(2) + ' TL', 70, yPos + 16);
            
            yPos += 40;
            
            doc.setFillColor(79, 70, 229);
            doc.rect(15, yPos, 180, 12, 'F');
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(12);
            doc.text(turkishToAscii('TAKSIT SECENEKLERI VE KOMISYON ORANLARI'), 20, yPos + 8);
            
            yPos += 20;
            
            doc.setFillColor(241, 245, 249);
            doc.rect(15, yPos, 180, 10, 'F');
            doc.setTextColor(51, 65, 85);
            doc.setFontSize(8);
            
            doc.text(turkishToAscii('TAKSIT DETAYI'), 20, yPos + 6);
            doc.text(turkishToAscii('MUSTERIDEN'), 75, yPos + 6);
            doc.text(turkishToAscii('AYLIK'), 115, yPos + 6);
            doc.text(turkishToAscii('KESINTI'), 145, yPos + 6);
            
            yPos += 15;
            
            // PDF Taksit döngüsü de 12 ile sınırlandırıldı
            for (let installment = 1; installment <= 12; installment++) {
                const rate = commissionRates.credit[installment];
                const saleAmount = desiredNet / (1 - rate / 100);
                const commissionAmount = saleAmount - desiredNet;
                const monthlyPayment = saleAmount / installment;
                
                if (installment % 2 === 0) {
                    doc.setFillColor(249, 250, 251);
                    doc.rect(15, yPos - 3, 180, 10, 'F'); // Satır yüksekliği artırıldı
                }
                
                if (installment === 1) {
                    doc.setFillColor(254, 243, 199);
                    doc.rect(15, yPos - 3, 180, 10, 'F'); // Satır yüksekliği artırıldı
                    doc.setTextColor(217, 119, 6);
                } else {
                    doc.setTextColor(51, 65, 85);
                }
                
                const installmentText = installment === 1 ? turkishToAscii('Tek Cekim') : installment + ' Taksit';
                
                // Taksit yazısı üstte
                doc.setFontSize(7);
                doc.text(installmentText, 20, yPos);
                
                // Yüzde oranı altta
                doc.setFontSize(6);
                doc.text('%' + rate, 20, yPos + 4);
                
                // Diğer sütunlar ortalanmış hizada
                doc.setFontSize(7);
                doc.text(saleAmount.toFixed(2) + ' TL', 75, yPos + 2);
                
                if (installment === 1) {
                    doc.text('-', 120, yPos + 2);
                } else {
                    doc.setTextColor(34, 197, 94);
                    doc.text(installment + 'x' + monthlyPayment.toFixed(2) + ' TL', 115, yPos + 2);
                }
                
                doc.setTextColor(225, 29, 72);
                doc.text('-' + commissionAmount.toFixed(2) + ' TL', 145, yPos + 2);
                
                yPos += 10; // Yeni satır aralığı
            }
            
            yPos += 5;
            doc.setFillColor(254, 242, 242);
            doc.rect(15, yPos, 180, 20, 'F');
            doc.setTextColor(153, 27, 27);
            doc.setFontSize(9);
            doc.text(turkishToAscii('NOT: Bu hesaplama bilgilendirme amaclidir.'), 20, yPos + 8);
            doc.text(turkishToAscii('Gercek komisyon oranlari bankaniza gore degisiklik gosterebilir.'), 20, yPos + 14);
            
            doc.setFillColor(79, 70, 229);
            doc.rect(0, 285, 210, 12, 'F');
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(8);
            doc.text(turkishToAscii('EYMEN MOBILE - Profesyonel Kredi Karti Cozumleri'), 20, 292);
            
            doc.save('EymenMobile_Komisyon_Raporu.pdf');
        }

        // Dark Mode 
        function toggleDarkMode() {
            const html = document.documentElement;
            const body = document.body;
            
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                body.classList.remove('dark-mode');
                body.classList.add('light-mode');
                localStorage.setItem('darkMode', 'false');
            } else {
                html.classList.add('dark');
                body.classList.remove('light-mode');
                body.classList.add('dark-mode');
                localStorage.setItem('darkMode', 'true');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const darkMode = localStorage.getItem('darkMode');
            if (darkMode === 'true') {
                document.documentElement.classList.add('dark');
                document.body.classList.remove('light-mode');
                document.body.classList.add('dark-mode');
            }
        });
    </script>
 </body>
